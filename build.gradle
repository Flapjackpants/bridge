plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.gradleup.shadow' version "${shadow_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

configurations {
	shade
	implementation.extendsFrom shade
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"discordbridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: config screen entry in Mod Menu. Compile-only, never required at runtime.
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}

	shade("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: "opus-java"
		exclude group: "com.google.crypto.tink"
	}
	// Animated WebP decoding (Klipy embeds). MediaDecoder builds the reader directly, not via ImageIO SPI.
	shade("com.twelvemonkeys.imageio:imageio-webp:${project.twelvemonkeys_version}")

	testImplementation(platform("org.junit:junit-bom:5.+"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
	useJUnitPlatform()
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveClassifier = "dev"
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

shadowJar {
	dependsOn jar
	from(zipTree(jar.archiveFile)) // includes main + client classes Loom put in jar
	configurations = [project.configurations.shade]
	archiveClassifier = ""
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	mergeServiceFiles()
	exclude "org/slf4j/**" // Minecraft provides SLF4J
	exclude "META-INF/services/javax.imageio.spi.*" // keep the WebP reader private, not a global ImageIO plugin
	def p = "${project.maven_group}.discordbridge.shadow"
	["okhttp3", "okio", "kotlin", "com.fasterxml.jackson", "com.neovisionaries",
	 "org.apache.commons.collections4", "gnu.trove", "org.json", "org.jetbrains", "org.intellij",
	 "com.twelvemonkeys"].each { relocate it, "${p}.${it}" }
}

assemble.dependsOn shadowJar

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
